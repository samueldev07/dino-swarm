<head>
<meta charset="utf-8" />

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #2a1d16; color: #ffe9a8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: none;
  }
  #stage { position: fixed; inset: 0; display: block; }
  #boot {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-content: center; justify-items: center; gap: 18px; padding: 24px;
    background: radial-gradient(ellipse at 50% 35%, #7a4c26 0%, #2a1d16 70%);
    transition: opacity .4s;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot img { width: min(78vw, 420px); height: auto; filter: drop-shadow(0 10px 18px rgba(0,0,0,.35)); }
  #boot p { max-width: 420px; text-align: center; font-size: 16px; line-height: 1.4; font-weight: 600; opacity: .9; }
  #boot .bar { width: 200px; height: 8px; border-radius: 99px; background: #2a1d14; overflow: hidden; border: 2px solid #2a1d14; }
  #boot .bar i { display: block; height: 100%; width: 40%; border-radius: 99px; background: #7bdc5a;
    animation: slide 1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%) } 100% { transform: translateX(350%) } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
  <h1 class="sr">Dino Swarm Survivors – Survivor Action Game</h1>
  <canvas id="stage" aria-label="Dino Swarm Survivors game"></canvas>
  <div id="boot">
    <h2 style="font:900 44px system-ui;color:#ffb02e;text-shadow:0 4px 0 #2a1d16">DINO SWARM</h2>
    <p>Move, dodge and evolve your dino against endless monster waves.</p>
    <div class="bar"><i></i></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
